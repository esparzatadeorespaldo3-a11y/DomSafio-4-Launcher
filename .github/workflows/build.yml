name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['proyecto.zip']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: unzip -q proyecto.zip
      - name: Compilar
        working-directory: DomSafio4Launcher
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DomSafio4-Launcher-apk
          path: DomSafio4Launcher/app/build/outputs/apk/debug/app-debug.apk
