name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Crear proyecto
        run: |
          echo '' | base64 -d > p.zip
          unzip -q p.zip
      - name: Compilar
        working-directory: DEDSafio4Launcher
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DEDSafio4-Launcher-apk
          path: DEDSafio4Launcher/app/build/outputs/apk/debug/app-debug.apk
